# PR test gate. Until this existed, PRs had no build/test CI at all — only
# CodeQL default setup, which does not run for fork PRs — so external
# contributions (e.g. #622) arrived with zero checks and review relied
# entirely on local runs.
#
# Mirrors `make test`: build tag duckdb_arrow is mandatory (Arc fails closed
# without it, #598) and the suite runs under -race.
#
# gofmt is deliberately NOT gated yet: a handful of pre-existing files
# (compaction/reconciliation/scheduler) are gofmt-dirty on main. Gate it once
# that debt is cleared.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -tags=duckdb_arrow ./...

      - name: Vet
        run: go vet -tags=duckdb_arrow ./...

      - name: Test (race)
        run: go test -tags=duckdb_arrow -race ./...

      # fasthttp runs body-stream writers on a bare goroutine with no recovery,
      # so a panic in one crashes the process rather than failing the request
      # (#717). Every writer must go through QueryHandler.safeStream. arcx_hook.go
      # is excluded because it builds only under the arcx_engine tag, which no
      # CI or release build uses, so it cannot be compile-checked here; it is
      # tracked separately.
      - name: Body-stream writers are panic-safe
        run: |
          unwrapped=$(grep -rn "SetBodyStreamWriter(" internal/api/*.go \
            | grep -v "_test.go" \
            | grep -v "internal/api/arcx_hook.go" \
            | grep -v "safeStream(" || true)
          if [ -n "$unwrapped" ]; then
            echo "These body-stream writers bypass safeStream, so a panic in them would crash the process:"
            echo "$unwrapped"
            exit 1
          fi
