# PR test gate. Until this existed, PRs had no build/test CI at all — only
# CodeQL default setup, which does not run for fork PRs — so external
# contributions (e.g. #622) arrived with zero checks and review relied
# entirely on local runs.
#
# Mirrors `make test`: build tag duckdb_arrow is mandatory (Arc fails closed
# without it, #598) and the suite runs under -race.
#
# gofmt is deliberately NOT gated yet: a handful of pre-existing files
# (compaction/reconciliation/scheduler) are gofmt-dirty on main. Gate it once
# that debt is cleared.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -tags=duckdb_arrow ./...

      - name: Vet
        run: go vet -tags=duckdb_arrow ./...

      - name: Test (race)
        run: go test -tags=duckdb_arrow -race ./...

      # The storage key contract (#743) is a property of real object stores,
      # not of a mock: MinIO folds a leading slash so "/a/x" and "a/x" are one
      # object, and Azure treats a backslash as a separator. Neither is
      # reproducible in a unit test, and both were found only by probing a live
      # server. Without this step the contract is asserted rather than enforced.
      #
      # docker run, not a service container: quay.io/minio/minio needs the
      # arguments `server /data`, and services have no way to supply arguments
      # after the image.
      - name: Start MinIO
        run: |
          docker run -d --name arc-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          # Poll rather than sleep: the first test would otherwise race startup.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready"; docker logs arc-ci-minio; exit 1

      - name: Create MinIO bucket
        run: |
          docker run --rm --network host --entrypoint sh quay.io/minio/mc -c \
            "mc alias set ci http://localhost:9000 minioadmin minioadmin && mc mb -p ci/arctest"

      # A separate tag set means a separate compile of the module. That is the
      # cost of covering this at all, and it is not run with -race: the tests
      # are I/O against a local server, so the detector adds build time without
      # adding signal.
      - name: Test against real object storage
        env:
          ARC_TEST_S3_BUCKET: arctest
          ARC_TEST_S3_ENDPOINT: http://localhost:9000
        run: go test -tags="duckdb_arrow objectstore" ./internal/storage/

      - name: Stop MinIO
        if: always()
        run: docker rm -f arc-ci-minio || true

      # fasthttp runs body-stream writers on a bare goroutine with no recovery,
      # so a panic in one crashes the process rather than failing the request
      # (#717). Every writer must go through QueryHandler.safeStream. arcx_hook.go
      # is excluded because it builds only under the arcx_engine tag, which no
      # CI or release build uses, so it cannot be compile-checked here; it is
      # tracked separately.
      #
      # NewStreamReader is matched as well as the two setters (#729): it is what
      # actually spawns the bare goroutine, so SetBodyStream around a raw
      # NewStreamReader would bypass safeStream while satisfying a setter-only
      # pattern. Comment lines are dropped so prose describing the API does not
      # trip the check.
      - name: Body-stream writers are panic-safe
        run: |
          unwrapped=$(grep -rnE "SetBodyStream(Writer)?\(|NewStreamReader\(" internal/api/*.go \
            | grep -v "_test.go" \
            | grep -v "internal/api/arcx_hook.go" \
            | grep -vE ":[0-9]+:[[:space:]]*//" \
            | grep -v "safeStream(" || true)
          if [ -n "$unwrapped" ]; then
            echo "These body-stream writers bypass safeStream, so a panic in them would crash the process:"
            echo "$unwrapped"
            exit 1
          fi
