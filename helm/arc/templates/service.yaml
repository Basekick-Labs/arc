apiVersion: v1
kind: Service
metadata:
  name: {{ include "arc.fullname" . }}
  labels:
    {{- include "arc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.flightSql.enabled }}
    - port: {{ int .Values.flightSql.servicePort }}
      targetPort: flight-sql
      protocol: TCP
      name: flight-sql
      appProtocol: grpc
    {{- end }}
  selector:
    {{- include "arc.selectorLabels" . | nindent 4 }}
