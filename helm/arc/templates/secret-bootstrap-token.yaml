{{- if and (not .Values.auth.bootstrapToken.existingSecret) .Values.auth.bootstrapToken.value }}
{{- if lt (len .Values.auth.bootstrapToken.value) 32 }}
{{- /* Arc refuses a shorter token, logs one error and starts with no admin token. */}}
{{- fail "auth.bootstrapToken.value must be at least 32 characters long" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arc.bootstrapTokenSecretName" . }}
  labels:
    {{- include "arc.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap-token: {{ .Values.auth.bootstrapToken.value | quote }}
{{- end }}
