# Default values for Arc (Go)

replicaCount: 1

# Update strategy for the Deployment. Defaults to Recreate because Arc uses a
# ReadWriteOnce PVC — RollingUpdate deadlocks when replicaCount=1: the new pod
# can't attach the volume until the old pod terminates, but RollingUpdate waits
# for the new pod to be ready first.
# Switch to RollingUpdate only when using shared object storage (s3/azure/minio)
# with Arc Enterprise clustering (e.g. multiple stateless reader replicas).
updateStrategy:
  type: Recreate
  # For RollingUpdate, tune these to control availability during rollout:
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0

image:
  repository: ghcr.io/basekick-labs/arc
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: arc.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
  # limits:
  #   cpu: 2000m
  #   memory: 4Gi
  # requests:
  #   cpu: 1000m
  #   memory: 2Gi

# startupProbe allowance: failureThreshold x 10 seconds of boot grace before
# liveness arms. Raise this when WAL recovery needs more than five minutes.
startupProbeFailureThreshold: 30

# Arc-specific configuration
arc:
  # Optional arc.toml override. When enabled, `contents` (the full arc.toml
  # text) is rendered into a ConfigMap and mounted at /app/arc.toml (subPath),
  # replacing the arc.toml baked into the image. ARC_* environment variables
  # still take precedence over the file.
  config:
    enabled: false
    contents: ""
  # Storage backend: local, s3, minio
  storageBackend: local
  # Write-ahead log. The Arc binary defaults this to false for backwards
  # compatibility; the chart turns it on, because without it a crash or a
  # SIGKILL loses every record buffered since the last flush. The directory
  # lives under the same mount as the data so the WAL survives a pod restart.
  wal:
    enabled: true
    directory: /app/data/wal
  # Additional environment variables
  env: []
    # - name: ARC_AUTH_ENABLED
    #   value: "true"

# Persistent storage for Arc data
persistence:
  enabled: true
  # storageClass: "-"
  accessMode: ReadWriteOnce
  # 10Gi is a dev-scale default. For object storage, size this PVC for peak
  # ingest rate x worst-case WAL flush lag, plus cache and recovery headroom.
  size: 10Gi
  # existingClaim: ""

# NOTE: there is deliberately no `autoscaling` block here.
#
# This chart previously exposed autoscaling.enabled/minReplicas/maxReplicas,
# but shipped no HorizontalPodAutoscaler template. Setting enabled=true only
# removed `replicas` from the Deployment, leaving one replica with nothing
# managing it — the values silently did nothing.
#
# Horizontal scaling of a single OSS Arc is not viable anyway: the default
# updateStrategy is Recreate over a ReadWriteOnce PVC (see the comment at the
# top of this file), so replicas cannot share the volume. Scaling out requires
# shared object storage plus Arc Enterprise clustering, where readers are
# separate StatefulSets — see the arc-enterprise chart.

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
