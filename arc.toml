# =============================================================================
# Arc Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
[server]
port = 8000

# TLS/HTTPS (disabled by default)
tls_enabled = false
# tls_cert_file = "/etc/letsencrypt/live/example.com/fullchain.pem"
# tls_key_file = "/etc/letsencrypt/live/example.com/privkey.pem"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[log]
level = "info"      # debug, info, warn, error, fatal, panic
format = "console"  # json or console

# -----------------------------------------------------------------------------
# Database (DuckDB)
# -----------------------------------------------------------------------------
# Auto-configured based on system resources if not set.
# Override via: ARC_DATABASE_MAX_CONNECTIONS, ARC_DATABASE_MEMORY_LIMIT, ARC_DATABASE_THREAD_COUNT
[database]
# max_connections = 28    # Default: 2x the HOST's CPU cores (min 4, max 64).
#                         # Deliberately not quota-derived: it bounds statements
#                         # in flight, and Arc queries are often S3-I/O-bound, so
#                         # a quota-sized pool converts concurrency into client
#                         # timeouts. Worth lowering BY HAND in a small container
#                         # though — this pool is the only global limit on
#                         # concurrent queries, and the Go-side memory of an
#                         # in-flight result is not covered by memory_limit.
# memory_limit = "8GB"    # Default: unset — DuckDB uses 80% of the container's
#                         # cgroup limit, or of host memory when unlimited.
#                         # Set this only to override that. Percent and unit-less
#                         # forms are rejected: DuckDB needs an absolute size.
# thread_count = 14       # Default: unset — DuckDB uses the container's CPU
#                         # quota (cpu.max), not the host's core count.
#                         # compaction.threads follows the quota too since
#                         # 26.09.3; see the [compaction] section below.
enable_wal = true

# Allow DuckDB to reorder results of queries WITHOUT an ORDER BY (queries
# with ORDER BY are unaffected); can reduce memory usage on large un-ordered
# scans and exports. Set true to restore pre-26.09.1 behavior where
# un-ordered SELECTs return rows in file/insertion order.
# preserve_insertion_order = false

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
[storage]
backend = "local"           # "local" or "s3"
# Arc REFUSES TO START when the backup destination overlaps this root — see the
# note on [backup].local_path. Setting this to a PARENT of the backup directory
# (for example "./data" beside the default backup path "./data/backups") is the
# shape that boots today and will not boot after the upgrade. An empty value is
# refused as itself.
local_path = "./data/arc"

# S3/MinIO (when backend = "s3")
#
# NOTE: the values below are the MinIO/local-dev defaults. For real AWS S3 you
# MUST set s3_use_ssl = true and s3_path_style = false, or every read fails with
# "403 Forbidden / AccessDenied" (plaintext HTTP + path-style addressing against
# s3.amazonaws.com). Arc's built-in defaults are already the AWS-correct ones —
# it is this sample file that opts into MinIO.
s3_bucket = "arc-test"
s3_region = "us-east-2"
s3_endpoint = ""            # Empty for AWS, set for MinIO
s3_use_ssl = false          # MinIO/dev. AWS S3: true
s3_path_style = true        # MinIO/dev. AWS S3: false
# Credentials via env: ARC_STORAGE_S3_ACCESS_KEY, ARC_STORAGE_S3_SECRET_KEY
# On EKS with IRSA, leave both unset: Arc detects AWS_ROLE_ARN +
# AWS_WEB_IDENTITY_TOKEN_FILE and authenticates via the pod's IAM role.
#
# A key prefix confines Arc to one subtree of the bucket or container, so
# several deployments can share one, and so a backup target can live beside the
# primary data. Both default to the root. Commented rather than set to "",
# because a shipped value is the effective configuration for every deployment
# that does not override it and an empty environment variable does not clear it
# (see TestShippedArcTomlHasNoLiveColdTierConnectionValues).
# s3_prefix = "instances/abc123"
#
# Azure Blob (when backend = "azure"). Credentials via env:
# ARC_STORAGE_AZURE_ACCOUNT_NAME, ARC_STORAGE_AZURE_ACCOUNT_KEY (or
# ARC_STORAGE_AZURE_CONNECTION_STRING).
# azure_container = ""
# azure_prefix = "instances/abc123"

# -----------------------------------------------------------------------------
# Ingestion
# -----------------------------------------------------------------------------
[ingest]
max_buffer_size = 5000000   # Records before flush (default: 50000)
max_buffer_age_ms = 100   # Max buffer age before flush

# Sort keys for compression/query performance: "measurement:col1,col2"
# Time column is always appended automatically
sort_keys = []
default_sort_keys = ""

# Parquet dictionary encoding at ingest. Off by default: ingest files are
# transient (hourly/daily compaction rewrites them via DuckDB, which applies
# its own adaptive encoding), and ingest-time dictionaries cost significant
# write CPU. Set use_dictionary = true to dictionary-encode string columns
# (smaller uncompacted hot partition, ~12% write throughput cost); add
# numeric_dictionary = true to also cover numeric/timestamp columns
# (pre-26.09.1 behavior).
# use_dictionary = false
# numeric_dictionary = false

# -----------------------------------------------------------------------------
# Compaction
# -----------------------------------------------------------------------------
[compaction]
enabled = true

# DuckDB thread count for EACH compaction subprocess.
# Default: unset (0) = half of the CPUs this process may use, minimum 1.
# Environment override: ARC_COMPACTION_THREADS=4
#
# "CPUs this process may use" is min(runtime.NumCPU(), runtime.GOMAXPROCS(0)):
# Go derives GOMAXPROCS from the container's CPU quota (cpu.max, or
# cpu.cfs_quota_us on cgroup v1), while NumCPU catches cpuset limits that no
# quota expresses. Before 26.09.3 this was half the HOST's core count, so a
# 2-CPU pod on a 64-core node ran every compaction job with 32 threads (#1030).
#
# Halving assumes the default max_concurrent = 2. Raising max_concurrent without
# lowering this oversubscribes: the subprocesses do not share a budget.
#
# This does not make the total fit the quota. On a 2-CPU quota the two
# subprocesses take 1 thread each and the main process takes the quota's 2 — 4
# threads against 2 CPUs. These are caps on parallelism, not reservations.
#
# Three things that change the derived value, all deliberate:
#   - GOMAXPROCS set ABOVE the quota is honoured, up to the machine's core count.
#   - GODEBUG=containermaxprocs=0 turns the runtime's cgroup read off entirely,
#     giving the pre-26.09.3 host-derived behaviour.
#   - the runtime floors GOMAXPROCS at 2, so --cpus=0.5 still yields 1 thread.
#
# Not licence-capped: this is resolved before the licence is applied, and a
# subprocess is a separate process. Set it by hand on a core-limited licence.
# threads = 4

# Maximum wall-clock budget for ONE scheduled or manual compaction cycle.
# Default: 30m. Positive Go duration syntax: 90s, 30m, 2h, 2h15m.
# Environment override: ARC_COMPACTION_CYCLE_TIMEOUT=2h
# Zero, negative and malformed durations are rejected at startup.
# This changes neither peak memory usage nor concurrency/threads/batch size;
# a larger timeout does not guarantee completion of arbitrary workloads.
# Overlapping scheduled ticks are skipped; a manual trigger during a running
# cycle returns HTTP 409. No second cycle runs concurrently in one manager.
# Manual targeting (database/measurement also scope manifest recovery; every
# cycle recovers orphans of all tiers, whichever tier it runs):
# POST /api/v1/compaction/trigger?database=db&measurement=cpu&tier=hourly
# measurement requires database. Failed recovery/eligibility lookups fail the
# cycle; valid delivery deferrals do not. A manifest that cannot be read is
# retained; one that cannot be decoded is parked as *.quarantined.
# cycle_timeout = "30m"

# Databases that scheduled cycles (and manual triggers without a database
# scope) skip during candidate discovery. A trigger that names a database
# (POST /api/v1/compaction/trigger?database=X) bypasses the list — combined,
# the two give control over what gets compacted and in which order.
# Exact, case-sensitive names — no globs, prefixes, or separator splitting.
# On a hub, received spoke data is excluded as "spoke/db" (one
# pseudo-database) or "spoke" (the whole namespace); the manual bypass works
# at spoke granularity only (?database= takes plain database names).
# Manifest recovery is never filtered: compactions a previous cycle already
# started always complete. This key gates compaction only — retention,
# tiering, and Iceberg export ignore it. Default: empty (nothing excluded).
# Environment override (whitespace-separated; a name containing spaces
# needs this TOML array): ARC_COMPACTION_EXCLUDE_DATABASES="staging imports"
# exclude_databases = ["staging", "imports_backlog"]

# Hourly
hourly_enabled = true
hourly_schedule = "5 * * * *"
hourly_min_age_hours = 1
hourly_min_files = 10

# Daily
daily_enabled = true
daily_schedule = "0 3 * * *"
daily_min_age_hours = 24
daily_min_files = 12

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
[auth]
enabled = true

# -----------------------------------------------------------------------------
# Delete
# -----------------------------------------------------------------------------
[delete]
enabled = true
confirmation_threshold = 10000
max_rows_per_delete = 1000000

# -----------------------------------------------------------------------------
# Retention
# -----------------------------------------------------------------------------
[retention]
enabled = true

# -----------------------------------------------------------------------------
# Continuous Queries
# -----------------------------------------------------------------------------
[continuous_query]
enabled = false

# -----------------------------------------------------------------------------
# MQTT
# -----------------------------------------------------------------------------
[mqtt]
enabled = false

# -----------------------------------------------------------------------------
# Query
# -----------------------------------------------------------------------------
[query]
# Stable measurement field schema (26.09.2, #914). Every measurement keeps a
# zero-row Parquet "anchor" under _schema/ listing every field it was ever
# written with; queries list it first so a field absent from the files in a
# narrow time range binds as a typed NULL column instead of a Binder Error,
# and SELECT * has the same columns over any range. Ingest maintains it.
# stable_schema = true
# Build anchors for measurements written before 26.09.2 in the background on
# first query, from at most this many file footers (newest days first,
# compacted files preferred). POST /api/v1/databases/{db}/measurements/{m}/schema/rebuild
# queues one on demand; GET .../schema shows the registered fields.
# stable_schema_bootstrap = true
# stable_schema_bootstrap_max_files = 500
# EXPERIMENTAL (#928): answer a time range proven to hold no data from the
# measurement's schema anchor alone instead of scanning the whole measurement.
# Applies to plain single-table queries with bare time bounds over at most 7
# days, on measurements whose anchor is complete; everything else keeps the
# full scan. Requires stable_schema. Opt-in while experimental.
# empty_range_anchor_scan = false

# Slow query logging threshold in milliseconds (0 = disabled)
# Queries exceeding this threshold emit a WARN log and increment arc_slow_queries_total
# slow_query_threshold_ms = 1000

# S3 file caching (improves CTEs, subqueries, dashboard queries)
enable_s3_cache = false
s3_cache_size = "128MB"
s3_cache_ttl_seconds = 3600

# -----------------------------------------------------------------------------
# Query Governance (Enterprise)
# -----------------------------------------------------------------------------
# Per-token rate limits, quotas and row caps. Defaults here apply to every token
# without an explicit policy; per-token policies are managed through
# /api/v1/governance/policies. 0 means unlimited. The per-query timeout override
# (max_scan_duration_sec) is per-policy only and has no default key here.
[governance]
enabled = false
# default_rate_limit_per_min = 0
# default_rate_limit_per_hour = 0
# default_max_queries_per_hour = 0
# default_max_queries_per_day = 0

# Caps the rows any single query returns. A capped response is a valid,
# complete-up-to-the-cap result, and says so: JSON and msgpack carry
# "rows_capped": true and "row_cap", Arrow IPC carries the Arc-Rows-Capped
# response trailer, and the server logs a WARN naming the token and counts
# arc_governance_queries_capped_total.
# default_max_rows_per_query = 0

# -----------------------------------------------------------------------------
# Scheduled network spoke sync (valid paid license required, as for CQ/retention).
# Manual network sync and air-gap bundle export remain available without a license.
# A network spoke also needs its hub URL, identities and environment-only credentials.
#
# [edge_sync.spoke]
# enabled = false
# sync_interval = "5m"         # Delay after a completed pass; at least 1s
# sync_retry_interval = "30s"  # Initial retry; doubles up to sync_interval
#                             # At least 1s and shorter than sync_interval
# Environment overrides:
# ARC_EDGE_SYNC_SPOKE_SYNC_INTERVAL
# ARC_EDGE_SYNC_SPOKE_SYNC_RETRY_INTERVAL
#
# -----------------------------------------------------------------------------
# Telemetry
# -----------------------------------------------------------------------------
[telemetry]
enabled = true

# -----------------------------------------------------------------------------
# Tiered Storage (Enterprise)
# -----------------------------------------------------------------------------
# Hot tier (local) -> Cold tier (S3/Azure) based on data age
[tiered_storage]
enabled = false
migration_schedule = "0 2 * * *"
migration_max_concurrent = 4
migration_batch_size = 100
default_hot_max_age_days = 0
migration_history_retention_days = 90

[tiered_storage.cold]
enabled = false
backend = "s3"              # "s3" or "azure"

# S3 — nothing below is set, on purpose. Arc's built-in defaults are already
# the AWS-correct ones (no endpoint, HTTPS, virtual-hosted addressing, and
# credentials from the AWS chain so IRSA and instance roles are detected), and
# a value shipped here cannot be cleared from the environment: an empty env var
# reads as unset, so ARC_TIERED_STORAGE_COLD_S3_ENDPOINT="" does NOT blank a
# value in this file. A cold tier meant for AWS would silently keep talking to
# whatever was shipped here.
#
# Set the bucket and region for your account; enabling the cold tier without a
# bucket is refused at startup rather than defaulted to anything.
s3_region = "us-east-1"
# s3_bucket = ""
#
# MinIO / another S3-compatible store — uncomment as a set:
# s3_endpoint = "localhost:9000"
# s3_access_key = "minioadmin"   # configured keys take precedence over the
# s3_secret_key = "minioadmin"   # AWS chain, so these disable IRSA detection
# s3_use_ssl = false
# s3_path_style = true
# Cold objects are written with no storage class set (S3 Standard) and read in
# place; there is deliberately no storage-class key. Keep bucket lifecycle
# rules off the cold prefix — Glacier or Deep Archive objects cannot be queried.

# Azure (when backend = "azure"). Objects take the storage account's default
# access tier; there is no access-tier key, for the same reason.
azure_container = ""
azure_endpoint = ""
azure_use_managed_identity = false
# A prefix lets the cold tier share one container with the primary store. Left
# commented for the same reason as the connection values above: a shipped value
# cannot be cleared by an empty environment variable.
# azure_prefix = "cold"

# -----------------------------------------------------------------------------
# Audit Logging (Enterprise)
# -----------------------------------------------------------------------------
[audit_log]
enabled = false
retention_days = 90
include_reads = false           # Log GET/query requests (high volume)

# Backup & Restore
# -----------------------------------------------------------------------------
[backup]
# BREAKING on upgrade, and it is these two keys that cause it, not the target
# block below: Arc now REFUSES TO START when the backup destination overlaps
# primary storage, and with no target configured the destination is
# local_path. A deployment whose local_path sits inside storage.local_path — or
# whose storage.local_path is a parent of it, such as "./data" — boots today
# and will not boot after the upgrade. The defaults below are disjoint and are
# unaffected. An empty local_path with no target is refused too, where it used
# to boot with the backup API quietly skipped.
enabled = true
local_path = "./data/backups"           # Directory for local backups; see the refusal note above
# How long one backup or one restore may run before its context is cancelled.
# Go duration syntax; must be positive. 2h is the value both were hardcoded to
# before this key existed.
# operation_timeout = "2h"
#
# A named backup TARGET makes the destination configurable, and it may be remote
# (#1085). Point default_target at it and local_path above is ignored entirely —
# the directory is not even created. SEVERAL targets are supported, with
# per-database routing: `databases = [...]` on a target sends those databases
# files there and everything else goes to default_target.
#
# A routed backup writes one manifest and one file sidecar PER TARGET, each
# describing its own slice and each naming the whole run, plus an index at
# <backup_id>/index.json on the default target that names every target the run
# touched. The listing then returns ONE entry per backup id, with every
# destination holding a slice of it; a target that will not answer is named in
# unreachable_targets and the rest of the listing still answers. A delete
# sweeps every target. A restore reads EVERY target of the run and REFUSES
# before writing anything if one of them is not configured here, will not
# answer, or holds no manifest for the id — restoring only the reachable part
# would report success over a set it did not restore.
#
# A database goes to exactly one target: naming it on two is refused at
# startup. Naming databases on default_target is allowed and does nothing,
# since everything unrouted goes there already, so put them on the target you
# want them to go TO: in the example below, default_target is "main" and only
# [backup.targets.audit] carries `databases`.
#
# Only the COMMA separates names. A database name may contain a space, so
# databases = "my db" is ONE name and databases = ["a", "b"] is two.
#
# A target nothing is routed to is INERT: no backup writes to it, and a warning
# at startup names it. It is not a refusal, because adding the target block and
# its databases in separate commits is ordinary, and it is deliberately not a
# leg either — a leg is probed before anything is copied, so a target nothing
# routes to would otherwise make an unrelated store a precondition of every
# backup in this instance, including whole-instance ones. The names are storage-root
# segments, exactly as a scoped backup names them, so an edge-sync spoke is
# named as the SPOKE: ["prod"] does not mean spoke1/prod.
#
# The instance-wide state always goes to default_target whatever the routing
# says, because it belongs to no one database: the SQLite database, the Iceberg
# SQL catalog, the Iceberg table metadata, an out-of-root Iceberg warehouse and
# this config file. A database's own field schema anchors (_schema/<db>/) and
# compaction recovery state (_compaction_state/<tier>/<db>/) DO travel with its
# data to its target.
#
# Target names are letters, digits and underscore only, and are lowercased. The
# rule that matters is the HYPHEN: it cannot appear in an environment variable
# name, so a hyphenated target could be set here and never afterwards
# overridden from the environment, which is how a credential stays in a config
# file for good. So "audit-bucket" is REFUSED and "audit_bucket" is not. Case is
# not a hazard — both this file and the environment are lowercased, so "Audit"
# and "audit" are one target.
#
# Arc REFUSES AT STARTUP a destination that overlaps primary storage or the
# tiered-storage cold tier, or ANOTHER backup target, for two reasons that are
# both permanent and both silent (two targets that contain one another are one
# listing, so each backup leg would enumerate the other objects and deleting
# one backup id would reach both). A destination inside the storage root is inventoried by the next
# backup, so each backup copies the previous one in full; on a cluster those
# files are absent from the Raft manifest, and past the skip ratio every
# replace-mode restore is refused. And with reconciliation enabled and
# manifest_only_dry_run off, its sweep DELETES the backups, because a backup
# data key has nine path segments and the sweep treats seven or more as a
# managed path.
#
# The same applies to a prefix that is a parent of, or sits under, the storage
# or cold-tier prefix, and every spelling of one endpoint counts as one store:
# leaving s3_endpoint empty for AWS on one side and writing out
# "s3.us-east-1.amazonaws.com" on the other does not make them two places. One
# bucket with DISJOINT prefixes is fine and is the intended shape.
#
# default_target = "main"
#
# [backup.targets.main]                  # the DEFAULT: everything unrouted goes here
# type = "local"                         # local, s3, minio, azure or azblob
# local_path = "/srv/arc-backups"
#
# [backup.targets.audit]                 # a ROUTED target: it carries `databases`
# type = "s3"
# databases = ["audit", "compliance"]    # these databases go here; everything else to default_target
#                                        # also "audit,compliance" or
#                                        # ARC_BACKUP_TARGETS_AUDIT_DATABASES=audit,compliance
#                                        # the COMMA is the only separator: "my db" is ONE name
# s3_bucket = "acme-arc-audit-backups"
# s3_prefix = "arc/backups"
# s3_region = "us-east-1"
# s3_endpoint = ""                       # set for MinIO/SeaweedFS
# s3_use_ssl = true
# s3_path_style = false                  # required for MinIO
# s3_access_key = ""                     # prefer ARC_BACKUP_TARGETS_AUDIT_S3_ACCESS_KEY
# s3_secret_key = ""                     # prefer ARC_BACKUP_TARGETS_AUDIT_S3_SECRET_KEY
#
# From the environment ALONE, with nothing in this file, a target takes an extra
# variable, because a name cannot be discovered from a map that does not exist:
#   ARC_BACKUP_TARGET_NAMES=main,audit
#   ARC_BACKUP_TARGETS_MAIN_TYPE=s3
#   ARC_BACKUP_TARGETS_MAIN_S3_BUCKET=acme-arc-backups
#   ARC_BACKUP_TARGETS_AUDIT_TYPE=s3
#   ARC_BACKUP_TARGETS_AUDIT_S3_BUCKET=acme-arc-audit-backups
#   ARC_BACKUP_TARGETS_AUDIT_DATABASES=audit,compliance
#   ARC_BACKUP_DEFAULT_TARGET=main
#
# With ANY remote target configured, include_config defaults to FALSE for every
# backup — not only when the DEFAULT target is remote: this file carries every
# target's own credentials, so a local default plus one remote routed target
# still means the default would put the keys that unlock that store inside a
# backup it holds. A request may ask for it explicitly and is warned, naming
# every remote target whose keys the backup then carries.
#
# Backups carry the identity of the instance that wrote them, so two instances
# sharing one bucket and prefix do not merge listings. On a cluster that
# identity is cluster.cluster_name, whose default is "arc-cluster" — SET IT, or
# two unrelated clusters on the default collide. Standalone, Arc mints a UUID
# and keeps it in a file beside the shared SQLite database. Switching a node
# from clustered to standalone therefore changes its identity, so its own
# earlier backups then read as foreign; they stay listable with
# include_foreign=true and stay restorable. A restore never
# adopts the identity in the backup it restored: the listing marks another
# instance backups as foreign_owner, and GET /api/v1/backup?include_foreign=true
# shows them, with a filtered_foreign count on the plain listing so an empty
# answer says what it withheld. That is what makes recovery onto fresh
# hardware possible.

# Query Management (Enterprise)
# -----------------------------------------------------------------------------
# [query_management]
# enabled = false
# history_size = 100              # Number of completed queries to keep in memory

[wal]
enabled = false